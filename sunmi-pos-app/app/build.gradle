plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.labparfumo.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.labparfumo.pos"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "2.0"

        // The web app the POS wraps. Change here if the URL ever changes.
        buildConfigField "String", "APP_URL", "\"https://lab-parfumo-central.vercel.app/login?next=/my\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }

    // name the APK with its version so you can SEE which build you're installing
    // (e.g. LabParfumoPOS-1.2-nativescan.apk) instead of a generic app-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "lp${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // SUNMI built-in thermal printer SDK (InnerPrinterManager / SunmiPrinterService)
    implementation 'com.sunmi:printerlibrary:1.0.18'
    // native barcode scanner for devices whose WebView can't reach the camera (SUNMI V3)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // bundled model — works WITHOUT Google Play Services (SUNMI is often non-GMS)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
