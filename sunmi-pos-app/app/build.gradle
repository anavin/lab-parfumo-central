plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.labparfumo.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.labparfumo.pos"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // The web app the POS wraps. Change here if the URL ever changes.
        buildConfigField "String", "APP_URL", "\"https://lab-parfumo-central.vercel.app/login?next=/my\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // SUNMI built-in thermal printer SDK (InnerPrinterManager / SunmiPrinterService)
    implementation 'com.sunmi:printerlibrary:1.0.18'
}
